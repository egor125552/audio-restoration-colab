name: Apply role and bitrate fix

on:
  push:
    branches:
      - agent/fix-role-mapping-source-bitrate

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-role-mapping-source-bitrate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply source patch
        run: python scripts/apply_role_bitrate_fix.py
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Ruff focused files
        run: >-
          ruff check
          workers/separator_server.py
          src/audio_restoration_colab/outputs.py
          src/audio_restoration_colab/jobs.py
          tests/test_separator_server.py
          tests/test_outputs.py
          tests/test_jobs.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_separator_server.py
          tests/test_outputs.py
          tests/test_jobs.py
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            workers/separator_server.py \
            src/audio_restoration_colab/outputs.py \
            src/audio_restoration_colab/jobs.py \
            tests/test_separator_server.py \
            tests/test_outputs.py \
            tests/test_jobs.py
          git commit -m "Fix stem role mapping and preserve source bitrate"
          git push
