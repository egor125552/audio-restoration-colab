name: Validate role and bitrate fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate expected source changes
        run: python scripts/apply_role_bitrate_fix.py
      - name: Install focused test tools
        run: python -m pip install --disable-pip-version-check pytest ruff
      - name: Ruff focused files
        run: >-
          ruff check
          workers/separator_server.py
          src/audio_restoration_colab/outputs.py
          src/audio_restoration_colab/jobs.py
          tests/test_separator_server.py
          tests/test_outputs.py
          tests/test_jobs.py
      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -q
          tests/test_separator_server.py
          tests/test_outputs.py
          tests/test_jobs.py
