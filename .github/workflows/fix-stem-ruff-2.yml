name: Довести стиль разделителя стемов

on:
  push:
    branches:
      - agent/stem-separator-mixer
    paths:
      - ".github/workflows/fix-stem-ruff-2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stem-separator-mixer
          fetch-depth: 0

      - name: Исправить оставшиеся замечания Ruff
        run: |
          python - <<'PY'
          from pathlib import Path

          mixer = Path("src/audio_restoration_colab/mixer.py")
          text = mixer.read_text(encoding="utf-8")
          text = text.replace(
              "import time\nfrom pathlib import Path\nfrom collections.abc import Callable\n",
              "import time\nfrom collections.abc import Callable\nfrom pathlib import Path\n",
              1,
          )
          mixer.write_text(text, encoding="utf-8")

          server = Path("workers/separator_server.py")
          text = server.read_text(encoding="utf-8")
          if "import contextlib\n" not in text:
              text = text.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport contextlib\n",
                  1,
              )
          text = text.replace(
              "from common import report_progress, write_manifest  # noqa: E402\n"
              "from audio_restoration_colab.catalog import get_model  # noqa: E402\n",
              "from common import report_progress, write_manifest  # noqa: E402\n\n"
              "from audio_restoration_colab.catalog import get_model  # noqa: E402\n",
              1,
          )
          server.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/fix-stem-ruff-2.yml

      - name: Проверить стиль, синтаксис и тесты
        env:
          PYTHONPATH: src:workers
        run: |
          python -m pip install -q ruff==0.16.1
          ruff check .
          python -m py_compile \
            src/audio_restoration_colab/mixer.py \
            workers/separator_server.py
          python -m unittest discover -s tests -v

      - name: Закоммитить исправление
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish stem separator lint fixes"
          git push origin HEAD:agent/stem-separator-mixer
