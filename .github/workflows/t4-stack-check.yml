name: Проверка стека AudioSR TensorRT

on:
  pull_request:
    paths:
      - "scripts/prepare_audiosr_t4.sh"
      - "scripts/probe_audiosr_t4.py"
      - "tests/test_audiosr_t4_probe.py"
      - ".github/workflows/t4-stack-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    name: Установка и импорты без GPU
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Получить код
        uses: actions/checkout@v7.0.1

      - name: Включить uv без многогигабайтного cache
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false

      - name: Установить тот же стек, что будет в Colab
        env:
          AUDIO_RESTORATION_T4_STACK_CHECK: "1"
        run: bash scripts/prepare_audiosr_t4.sh /tmp/audio-restoration-t4-stack

      - name: Проверить API закреплённого AudioSR
        run: |
          /tmp/audio-restoration-t4-stack/envs/audiosr_trt/bin/python - <<'PY'
          import inspect

          from audiosr.latent_diffusion.modules import attention
          from audiosr.latent_diffusion.modules.diffusionmodules import openaimodel

          expected = ["func", "inputs", "params", "flag"]
          for module in (attention, openaimodel):
              actual = list(inspect.signature(module.checkpoint).parameters)
              if actual != expected:
                  raise SystemExit(
                      f"Неожиданная сигнатура checkpoint в {module.__name__}: "
                      f"{actual!r}"
                  )
          print("AudioSR checkpoint API совпадает с probe-wrapper.")
          PY

      - name: Проверить опции Torch-TensorRT без GPU-импорта
        run: |
          /tmp/audio-restoration-t4-stack/envs/audiosr_trt/bin/python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          distribution = importlib.metadata.distribution("torch-tensorrt")
          root = Path(distribution.locate_file(""))
          source_files = list((root / "torch_tensorrt").rglob("*.py"))
          source = "\n".join(
              path.read_text(encoding="utf-8", errors="replace")
              for path in source_files
          )
          required = {
              "enabled_precisions",
              "min_block_size",
              "optimization_level",
              "truncate_long_and_double",
              "use_python_runtime",
              "pass_through_build_failures",
          }
          missing = sorted(option for option in required if option not in source)
          if missing:
              raise SystemExit(
                  "В установленном Torch-TensorRT не найдены опции: "
                  + ", ".join(missing)
              )
          print("Torch-TensorRT содержит все опции, используемые probe.")
          PY

      - name: Проверить CLI probe без запуска GPU
        run: |
          /tmp/audio-restoration-t4-stack/envs/audiosr_trt/bin/python \
            scripts/probe_audiosr_t4.py --help

      - name: Проверить синтаксис обоих скриптов
        run: |
          bash -n scripts/prepare_audiosr_t4.sh
          python -m py_compile scripts/probe_audiosr_t4.py
