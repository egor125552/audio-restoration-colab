name: Настоящий инференс моделей

on:
  workflow_dispatch:
    inputs:
      models:
        description: JSON-список моделей
        required: true
        default: '["denoise_normal","denoise_aggressive","lavasr_small","flashsr_medium","audiosr_large"]'

permissions:
  contents: read

jobs:
  inference:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Системные программы
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git-lfs espeak-ng
          git lfs install
      - name: Интерфейс
        run: uv sync
      - name: Секундный WAV
        run: ffmpeg -f lavfi -i "sine=frequency=440:duration=1" -ar 48000 -ac 1 "$RUNNER_TEMP/input.wav" -y
      - name: Скачать модель и сделать настоящий инференс
        env:
          AUDIO_RESTORATION_CACHE: ${{ runner.temp }}/audio-models
          PYTHONUNBUFFERED: "1"
        run: uv run python scripts/ci_model_smoke.py "${{ matrix.model }}" "$RUNNER_TEMP/input.wav"
