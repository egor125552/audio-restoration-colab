name: Диагностика DeNoise normal

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  denoise-normal-diagnostic:
    name: denoise_normal diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Системные программы
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg git-lfs espeak-ng
          git lfs install
      - name: Интерфейс
        run: uv sync
      - name: Секундный WAV
        run: ffmpeg -f lavfi -i "sine=frequency=440:duration=1" -ar 48000 -ac 1 "$RUNNER_TEMP/input.wav" -y
      - name: Подготовить среду separator
        env:
          AUDIO_RESTORATION_CACHE: ${{ runner.temp }}/audio-models
        run: timeout 180s ./scripts/prepare_backend.sh separator "$AUDIO_RESTORATION_CACHE"
      - name: Отдельно загрузить вес denoise_normal
        env:
          AUDIO_RESTORATION_CACHE: ${{ runner.temp }}/audio-models
          PYTHONUNBUFFERED: "1"
        run: |
          timeout 180s "$AUDIO_RESTORATION_CACHE/envs/separator/bin/python" - <<'PY'
          from audio_separator.separator import Separator
          import os
          from pathlib import Path

          cache = Path(os.environ["AUDIO_RESTORATION_CACHE"])
          separator = Separator(
              output_dir=str(cache / "diagnostic-output"),
              model_file_dir=str(cache / "weights" / "separator"),
              output_format="WAV",
              use_autocast=True,
              mdxc_params={
                  "segment_size": 256,
                  "override_model_segment_size": True,
                  "batch_size": 1,
                  "overlap": 8,
              },
          )
          print("Начинаю load_model denoise_normal", flush=True)
          separator.load_model(model_filename="denoise_mel_band_roformer_aufr33_sdr_27.9959.ckpt")
          print("load_model denoise_normal готов", flush=True)
          PY
      - name: Настоящий инференс denoise_normal
        env:
          AUDIO_RESTORATION_CACHE: ${{ runner.temp }}/audio-models
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/normal-output"
          timeout 180s "$AUDIO_RESTORATION_CACHE/envs/separator/bin/python" workers/separator_worker.py \
            --model-id denoise_normal \
            --input "$RUNNER_TEMP/input.wav" \
            --output-dir "$RUNNER_TEMP/normal-output" \
            --settings-json '{"quality":"balanced","segment":256}'
          test -s "$RUNNER_TEMP/normal-output/manifest.json"
          echo "denoise_normal: настоящий инференс готов"
