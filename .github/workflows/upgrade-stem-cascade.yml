          )

          docs_path = Path("docs/stem-separator.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              "3. Повторный запуск той же задачи использует уже загруженную модель и не читает веса заново.\n"
              "4. При переходе на другую тяжёлую модель предыдущая модель выгружается из VRAM, чтобы Tesla T4 не получила ошибку нехватки памяти.\n",
              "3. Повторный запуск той же задачи использует уже загруженную модель и не читает веса заново.\n"
              "4. В памяти сохраняются две последние модели по LRU. Это позволяет каскаду подробных барабанов держать одновременно общий HTDemucs и DrumSep.\n"
              "5. При загрузке третьей тяжёлой модели выгружается самая давно использованная; если CUDA всё равно сообщает нехватку памяти, кэш очищается и загрузка автоматически повторяется.\n",
          )
          docs_path.write_text(docs, encoding="utf-8")
          PY
          rm -f .github/workflows/upgrade-stem-cascade.yml

      - name: Проверить стиль, синтаксис и тесты
        env:
          PYTHONPATH: src:workers
        run: |
          python -m pip install -q ruff==0.16.1
          ruff check --fix \
            src/audio_restoration_colab/catalog.py \
            workers/separator_server.py \
            tests/test_stem_cascade.py
          ruff format \
            src/audio_restoration_colab/catalog.py \
            workers/separator_server.py \
            tests/test_stem_cascade.py
          ruff check .
          python -m py_compile \
            src/audio_restoration_colab/catalog.py \
            workers/separator_server.py \
            tests/test_stem_cascade.py
          python -m unittest discover -s tests -v

      - name: Закоммитить каскады и кэш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cached two-stage drum separation"
          git push origin HEAD:agent/stem-separator-mixer
