ne("fake", object(), key, model_id)\n\n        def fake_separate_source(**kwargs):\n            cached = kwargs["cached"]\n            roles = tuple(kwargs["expected_roles"])\n            output_dir = Path(kwargs["output_dir"])\n            output_dir.mkdir(parents=True, exist_ok=True)\n            calls.append((cached.model_id, roles))\n            results = {}\n            for role in roles:\n                path = output_dir / f"{role}.wav"\n                path.write_bytes(role.encode("utf-8"))\n                results[role] = path\n            return results\n\n        session._get_engine = fake_get_engine  # type: ignore[method-assign]\n        session._separate_source = fake_separate_source  # type: ignore[method-assign]\n\n        with tempfile.TemporaryDirectory() as directory:\n            root = Path(directory)\n            source = root / "song.wav"\n            source.write_bytes(b"audio")\n            output = root / "output"\n            output.mkdir()\n            results = session._run_model(\n                model_id="stems_drums_detailed",\n                source=source,\n                output_dir=output,\n                settings={"chunk_minutes": 10},\n            )\n\n        self.assertEqual(calls[0][0], "stems_four")\n        self.assertIn("drums", calls[0][1])\n        self.assertEqual(calls[1][0], "stems_drums_detailed")\n        self.assertEqual(\n            calls[1][1],\n            ("kick", "snare", "toms", "cymbals"),\n        )\n        self.assertEqual(\n            tuple(results),\n            ("drums", "kick", "snare", "toms", "cymbals"),\n        )\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',
