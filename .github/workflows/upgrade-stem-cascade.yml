name: Добавить каскады и LRU-кэш моделей

on:
  push:
    branches:
      - agent/stem-separator-mixer
    paths:
      - ".github/workflows/upgrade-stem-cascade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stem-separator-mixer
          fetch-depth: 0

      - name: Добавить каскад и двухмодельный LRU-кэш
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog_path = Path("src/audio_restoration_colab/catalog.py")
          catalog = catalog_path.read_text(encoding="utf-8")
          catalog = catalog.replace(
              '    license_text: str = ""\n',
              '    license_text: str = ""\n'
              '    preprocess_model_id: str | None = None\n'
              '    preprocess_role: str | None = None\n',
              1,
          )
          catalog = catalog.replace(
              '        warning=(\n'
              '            "Лучший результат получается, если сначала подать уже выделенную "\n'
              '            "общую дорожку барабанов. На полной песне возможны примеси."\n'
              '        ),\n'
              '        output_roles=("kick", "snare", "toms", "cymbals"),\n'
              '        settings=STEM_SETTINGS,\n'
              '        model_filename="demucs:drumsep",\n',
              '        warning=(\n'
              '            "Внутри автоматически выполняются два этапа: сначала общие "\n'
              '            "барабаны, затем DrumSep. Обе модели кэшируются в памяти."\n'
              '        ),\n'
              '        output_roles=("drums", "kick", "snare", "toms", "cymbals"),\n'
              '        settings=STEM_SETTINGS,\n'
              '        model_filename="demucs:drumsep",\n'
              '        preprocess_model_id="stems_four",\n'
              '        preprocess_role="drums",\n',
              1,
          )
          catalog_path.write_text(catalog, encoding="utf-8")

          server_path = Path("workers/separator_server.py")
          server = server_path.read_text(encoding="utf-8")
          server = server.replace(
              "import traceback\nfrom pathlib import Path\nfrom typing import Any\n",
              "import traceback\nfrom collections import OrderedDict\n"
              "from dataclasses import dataclass\nfrom pathlib import Path\n"
              "from typing import Any\n",
              1,
          )
          start = server.index("class SeparatorSession:")
          end = server.index("\ndef _run_demucs", start)
          new_class = r'''@dataclass
class CachedEngine:
    kind: str
    engine: Any
    cache_key: tuple[object, ...]
    model_id: str


class SeparatorSession:
    def __init__(self) -> None:
        self.engines: OrderedDict[
            tuple[object, ...], CachedEngine
        ] = OrderedDict()
        self.max_loaded_models = max(
            1,
            int(os.environ.get("AUDIO_RESTORATION_MAX_LOADED_MODELS", "2")),
        )
        self.last_model_id: str | None = None

    @property
    def model_id(self) -> str | None:
        return self.last_model_id

    def run(self, request: dict[str, Any]) -> None:
        model_id = str(request["model_id"])
        source = Path(str(request["input"])).resolve()
        output_dir = Path(str(request["output_dir"])).resolve()
        settings = dict(request.get("settings") or {})
        model = get_model(model_id)
        if model.backend != "stems":
            raise ValueError(f"{model_id} не относится к stem-разделителю.")
        if not source.is_file():
            raise ValueError(f"Входной файл не найден: {source}")
        output_dir.mkdir(parents=True, exist_ok=True)

        report_progress(0.02, "Разделитель: проверяю кэш моделей…")
        raw_results = self._run_model(
            model_id=model_id,
            source=source,
            output_dir=output_dir,
            settings=settings,
        )
        write_manifest(
            output_dir,
            [(role, path) for role, path in raw_results.items()],
        )
        report_progress(1.0, "Разделитель: готово.")

        if not bool(settings.get("keep_loaded", True)):
            self.unload()

    def unload(self, cache_key: tuple[object, ...] | None = None) -> None:
        if cache_key is None:
            entries = list(self.engines.values())
            self.engines.clear()
            self.last_model_id = None
        else:
            entry = self.engines.pop(cache_key, None)
            entries = [entry] if entry is not None else []
            if entry is not None and self.last_model_id == entry.model_id:
                self.last_model_id = None
        for entry in entries:
            self._release_entry(entry)
        if entries:
            self._clear_cuda_cache()
            print(
                f"[stem-server] Выгружено моделей: {len(entries)}.",
                flush=True,
            )

    def _release_entry(self, entry: CachedEngine) -> None:
        release = getattr(entry.engine, "release", None)
        if callable(release):
            with contextlib.suppress(Exception):
                release()

    @staticmethod
    def _clear_cuda_cache() -> None:
        gc.collect()
        try:
            import torch

            if torch.cuda.is_available():
                torch.cuda.empty_cache()
        except ImportError:
            pass

    def _run_model(
        self,
        *,
        model_id: str,
        source: Path,
        output_dir: Path,
        settings: dict[str, Any],
    ) -> dict[str, Path]:
        model = get_model(model_id)
        if model.preprocess_model_id:
            return self._run_cascade(
                model_id=model_id,
                source=source,
                output_dir=output_dir,
                settings=settings,
            )
        cached = self._get_engine(
            model_id=model_id,
            output_dir=output_dir,
            settings=settings,
            progress_base=0.02,
        )
        return self._separate_source(
            cached=cached,
            source=source,
            output_dir=output_dir,
            expected_roles=model.output_roles,
            chunk_minutes=max(1, int(settings.get("chunk_minutes", 10))),
            progress_start=0.24,
            progress_end=0.90,
            stage_title="песня",
        )

    def _run_cascade(
        self,
        *,
        model_id: str,
        source: Path,
        output_dir: Path,
        settings: dict[str, Any],
    ) -> dict[str, Path]:
        model = get_model(model_id)
        preprocess_id = model.preprocess_model_id
        preprocess_role = model.preprocess_role
        if not preprocess_id or not preprocess_role:
            raise ValueError(f"Для каскада {model_id} не задан первый этап.")
        preprocess_model = get_model(preprocess_id)
        chunk_minutes = max(1, int(settings.get("chunk_minutes", 10)))

        report_progress(
            0.04,
            "Каскад 1/2: выделяю общую дорожку барабанов…",
        )
        with tempfile.TemporaryDirectory(
            prefix="stem-cascade-",
            dir=output_dir,
        ) as temp:
            temp_root = Path(temp)
            first_output = temp_root / "first-stage"
            first_output.mkdir()
            first_engine = self._get_engine(
                model_id=preprocess_id,
                output_dir=first_output,
                settings=settings,
                progress_base=0.04,
            )
            first_results = self._separate_source(
                cached=first_engine,
                source=source,
                output_dir=first_output,
                expected_roles=preprocess_model.output_roles,
                chunk_minutes=chunk_minutes,
                progress_start=0.14,
                progress_end=0.53,
                stage_title="общие барабаны",
            )
            if preprocess_role not in first_results:
                raise ValueError(
                    f"Первый этап не вернул дорожку {preprocess_role}."
                )

            report_progress(
                0.55,
                "Каскад 2/2: разбираю барабаны на элементы…",
            )
            final_engine = self._get_engine(
                model_id=model_id,
                output_dir=output_dir,
                settings=settings,
                progress_base=0.55,
            )
            final_roles = tuple(
                role for role in model.output_roles if role != preprocess_role
            )
            final_results = self._separate_source(
                cached=final_engine,
                source=first_results[preprocess_role],
                output_dir=output_dir,
                expected_roles=final_roles,
                chunk_minutes=chunk_minutes,
                progress_start=0.65,
                progress_end=0.93,
                stage_title="элементы барабанов",
            )
            common_target = output_dir / f"{preprocess_role}.wav"
            shutil.copy2(first_results[preprocess_role], common_target)
            return {preprocess_role: common_target.resolve(), **final_results}

    def _get_engine(
        self,
        *,
        model_id: str,
        output_dir: Path,
        settings: dict[str, Any],
        progress_base: float,
    ) -> CachedEngine:
        model = get_model(model_id)
        quality = str(settings.get("quality", "balanced"))
        segment = int(settings.get("segment", 256))
        overlap = int(settings.get("overlap", 8))
        use_autocast = quality != "maximum"
        engine_kind = (
            "demucs"
            if (model.model_filename or "").startswith("demucs:")
            else "audio_separator"
        )
        cache_key = (
            model_id,
            engine_kind,
            segment,
            overlap,
            use_autocast,
            model.model_filename,
            model.ensemble_preset,
        )
        cached = self.engines.get(cache_key)
        if cached is not None:
            self.engines.move_to_end(cache_key)
            self._set_output_dir(cached.engine, output_dir)
            self.last_model_id = model_id
            report_progress(
                min(0.98, progress_base + 0.02),
                "Разделитель: использую уже загруженную модель из VRAM.",
            )
            return cached

        report_progress(
            min(0.98, progress_base + 0.03),
            "Разделитель: загружаю модель в постоянный кэш…",
        )
        try:
            engine = self._load_engine(
                model_id=model_id,
                output_dir=output_dir,
                quality=quality,
                segment=segment,
                overlap=overlap,
                use_autocast=use_autocast,
                engine_kind=engine_kind,
                progress_fraction=min(0.98, progress_base + 0.05),
            )
        except RuntimeError as error:
            if "out of memory" not in str(error).lower() or not self.engines:
                raise
            report_progress(
                min(0.98, progress_base + 0.04),
                "VRAM не хватило: выгружаю старый кэш и повторяю загрузку…",
            )
            self.unload()
            engine = self._load_engine(
                model_id=model_id,
                output_dir=output_dir,
                quality=quality,
                segment=segment,
                overlap=overlap,
                use_autocast=use_autocast,
                engine_kind=engine_kind,
                progress_fraction=min(0.98, progress_base + 0.05),
            )

        cached = CachedEngine(
            kind=engine_kind,
            engine=engine,
            cache_key=cache_key,
            model_id=model_id,
        )
        self.engines[cache_key] = cached
        self.engines.move_to_end(cache_key)
        self.last_model_id = model_id
        self._trim_cache(protected_key=cache_key)
        report_progress(
            min(0.98, progress_base + 0.08),
            "Разделитель: модель загружена и сохранена для повторов.",
        )
        return cached

    def _trim_cache(self, *, protected_key: tuple[object, ...]) -> None:
        while len(self.engines) > self.max_loaded_models:
            oldest_key = next(iter(self.engines))
            if oldest_key == protected_key and len(self.engines) > 1:
                self.engines.move_to_end(oldest_key)
                oldest_key = next(iter(self.engines))
            oldest = self.engines.pop(oldest_key)
            self._release_entry(oldest)
            self._clear_cuda_cache()
            print(
                f"[stem-server] LRU: выгружена модель {oldest.model_id}.",
                flush=True,
            )

    def _load_engine(
        self,
        *,
        model_id: str,
        output_dir: Path,
        quality: str,
        segment: int,
        overlap: int,
        use_autocast: bool,
        engine_kind: str,
        progress_fraction: float,
    ):
        model = get_model(model_id)
        if engine_kind == "demucs":
            return self._load_demucs(
                model.model_filename or "",
                progress_fraction=progress_fraction,
            )
        return self._load_audio_separator(
            model_id=model_id,
            output_dir=output_dir,
            quality=quality,
            segment=segment,
            overlap=overlap,
            use_autocast=use_autocast,
            progress_fraction=progress_fraction,
        )

    def _load_demucs(
        self,
        model_filename: str,
        *,
        progress_fraction: float,
    ):
        model_name = model_filename.split(":", 1)[1]
        report_progress(
            progress_fraction,
            "Разделитель: загружаю проверенный Demucs checkpoint; "
            "скачивание требуется только один раз…",
        )
        import torch
        from demucs_infer import DemucsSession

        cache_root = Path(
            os.environ.get(
                "AUDIO_RESTORATION_CACHE",
                "/content/audio-restoration-models",
            )
        )
        cache_dir = cache_root / "weights" / "demucs-infer"
        cache_dir.mkdir(parents=True, exist_ok=True)
        device = "cuda" if torch.cuda.is_available() else "cpu"
        session = DemucsSession(
            model=model_name,
            device=device,
            cache_dir=cache_dir,
        )
        session.load()
        return session

    def _load_audio_separator(
        self,
        *,
        model_id: str,
        output_dir: Path,
        quality: str,
        segment: int,
        overlap: int,
        use_autocast: bool,
        progress_fraction: float,
    ):
        from audio_separator.separator import Separator

        model = get_model(model_id)
        cache_root = Path(
            os.environ.get(
                "AUDIO_RESTORATION_CACHE",
                "/content/audio-restoration-models",
            )
        )
        model_dir = cache_root / "weights" / "separator"
        model_dir.mkdir(parents=True, exist_ok=True)
        demucs_overlap = min(0.75, max(0.1, overlap / 16.0))
        separator = Separator(
            output_dir=str(output_dir),
            model_file_dir=str(model_dir),
            output_format="WAV",
            use_soundfile=True,
            use_autocast=use_autocast,
            mdxc_params={
                "segment_size": segment,
                "override_model_segment_size": True,
                "batch_size": 1,
                "overlap": overlap,
            },
            demucs_params={
                "segment_size": "Default",
                "shifts": 2 if quality != "fast" else 1,
                "overlap": demucs_overlap,
                "segments_enabled": True,
            },
            ensemble_preset=model.ensemble_preset,
        )
        if model.ensemble_preset:
            report_progress(
                progress_fraction,
                "Разделитель: загружаю модели ансамбля; "
                "скачивание требуется только один раз…",
            )
            separator.load_model()
        elif model.model_filename:
            report_progress(
                progress_fraction,
                "Разделитель: загружаю веса; "
                "скачивание требуется только один раз…",
            )
            separator.load_model(model_filename=model.model_filename)
        else:
            raise ValueError(f"Для {model_id} не задан checkpoint или preset.")
        return separator

    def _separate_source(
        self,
        *,
        cached: CachedEngine,
        source: Path,
        output_dir: Path,
        expected_roles: tuple[str, ...],
        chunk_minutes: int,
        progress_start: float,
        progress_end: float,
        stage_title: str,
    ) -> dict[str, Path]:
        duration = _probe_duration(source)
        if duration > chunk_minutes * 60 * 1.1:
            return self._separate_long(
                cached=cached,
                source=source,
                output_dir=output_dir,
                expected_roles=expected_roles,
                chunk_seconds=chunk_minutes * 60,
                progress_start=progress_start,
                progress_end=progress_end,
                stage_title=stage_title,
            )
        return self._separate_once(
            cached=cached,
            source=source,
            output_dir=output_dir,
            expected_roles=expected_roles,
            progress_start=progress_start,
            progress_end=progress_end,
            stage_title=stage_title,
        )

    def _separate_once(
        self,
        *,
        cached: CachedEngine,
        source: Path,
        output_dir: Path,
        expected_roles: tuple[str, ...],
        progress_start: float,
        progress_end: float,
        stage_title: str,
    ) -> dict[str, Path]:
        report_progress(
            progress_start,
            f"Разделитель: анализирую {stage_title} —",
            tqdm_span=max(0.0, progress_end - progress_start),
        )
        paths = self._run_engine(
            cached=cached,
            source=source,
            output_dir=output_dir,
        )
        return _canonicalize_outputs(
            paths=paths,
            output_dir=output_dir,
            expected_roles=expected_roles,
        )

    def _separate_long(
        self,
        *,
        cached: CachedEngine,
        source: Path,
        output_dir: Path,
        expected_roles: tuple[str, ...],
        chunk_seconds: int,
        progress_start: float,
        progress_end: float,
        stage_title: str,
    ) -> dict[str, Path]:
        report_progress(
            progress_start,
            f"Разделитель: {stage_title} — режу длинный файл на части…",
        )
        with tempfile.TemporaryDirectory(
            prefix="stem-chunks-",
            dir=output_dir,
        ) as temp:
            temp_root = Path(temp)
            chunks = _split_audio(
                source=source,
                output_dir=temp_root / "input",
                chunk_seconds=chunk_seconds,
            )
            if not chunks:
                raise ValueError("Не удалось разделить длинный файл на части.")
            by_role: dict[str, list[Path]] = {
                role: [] for role in expected_roles
            }
            usable_span = max(0.0, progress_end - progress_start)
            process_span = usable_span * 0.9
            for index, chunk in enumerate(chunks, start=1):
                fraction = progress_start + process_span * (
                    (index - 1) / len(chunks)
                )
                report_progress(
                    fraction,
                    f"Разделитель: кусок {index} из {len(chunks)} —",
                    tqdm_span=process_span / len(chunks),
                )
                chunk_output = temp_root / f"result-{index:04d}"
                chunk_output.mkdir()
                paths = self._run_engine(
                    cached=cached,
                    source=chunk,
                    output_dir=chunk_output,
                )
                mapped = _canonicalize_outputs(
                    paths=paths,
                    output_dir=chunk_output,
                    expected_roles=expected_roles,
                )
                for role in expected_roles:
                    by_role[role].append(mapped[role])

            report_progress(
                progress_start + process_span,
                "Разделитель: объединяю крупные куски…",
            )
            results: dict[str, Path] = {}
            for role, parts in by_role.items():
                target = output_dir / f"{role}.wav"
                _concat_audio(parts, target)
                results[role] = target
            return results

    def _run_engine(
        self,
        *,
        cached: CachedEngine,
        source: Path,
        output_dir: Path,
    ) -> list[Path]:
        if cached.kind == "demucs":
            return _run_demucs(
                session=cached.engine,
                source=source,
                output_dir=output_dir,
            )
        self._set_output_dir(cached.engine, output_dir)
        raw_paths = cached.engine.separate(str(source))
        return _resolve_paths(output_dir, raw_paths)

