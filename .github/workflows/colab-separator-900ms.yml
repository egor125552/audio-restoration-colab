name: Реальный инференс разделителей на 900 мс

on:
  pull_request:
    paths:
      - "src/audio_restoration_colab/catalog.py"
      - "src/audio_restoration_colab/top_models.py"
      - "workers/separator_server.py"
      - "scripts/prepare_backend.sh"
      - "scripts/probe_separator_models_900ms.py"
      - ".github/workflows/colab-separator-900ms.yml"
  workflow_dispatch:

concurrency:
  group: colab-separator-900ms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-inference:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: us-docker.pkg.dev/colab-images/public/cpu-runtime:latest
      options: --user 0
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - group: core
            title: Основные модели и DeNoise
            models: >-
              denoise_normal denoise_aggressive stems_six stems_four stems_guitar
          - group: vocals
            title: Вокал, минусовка и финальная очистка
            models: >-
              stems_vocal_balanced stems_vocal_clean stems_instrumental_clean
              stems_instrumental_full stems_karaoke stems_bleed_suppressor
              stems_aspiration
          - group: reverb
            title: DeReverb и DeEcho
            models: >-
              dereverb_big dereverb_super dereverb_echo dereverb_fused

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Показать контейнер Colab
        run: |
          python - <<'PY'
          import platform
          import sys

          import torch

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("PyTorch:", torch.__version__)
          print("CUDA build:", torch.version.cuda)
          print("CUDA available:", torch.cuda.is_available())
          PY
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Установить uv
        run: python -m pip install --disable-pip-version-check -q "uv==0.12.0"

      - name: Восстановить кэш весов этой группы
        uses: actions/cache@v4
        with:
          path: /tmp/audio-restoration-models/weights/separator
          key: separator-0445-${{ matrix.group }}-${{ runner.os }}

      - name: Создать реальную среду разделителя
        run: |
          bash scripts/prepare_backend.sh \
            separator \
            /tmp/audio-restoration-models
          /tmp/audio-restoration-models/envs/separator/bin/python -m pip check

      - name: Полностью обработать 900 мс всеми моделями группы
        env:
          AUDIO_RESTORATION_PROJECT_ROOT: ${{ github.workspace }}
          AUDIO_RESTORATION_CACHE: /tmp/audio-restoration-models
        run: |
          mkdir -p "test-artifacts/colab-900ms-${{ matrix.group }}"
          /tmp/audio-restoration-models/envs/separator/bin/python \
            scripts/probe_separator_models_900ms.py \
            --output-dir "test-artifacts/colab-900ms-${{ matrix.group }}" \
            --models ${{ matrix.models }}

      - name: Сохранить WAV, manifest и отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-900ms-${{ matrix.group }}
          path: test-artifacts/colab-900ms-${{ matrix.group }}
          if-no-files-found: warn
          retention-days: 7
