name: Реальный инференс 900 мс в контейнере Colab

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stem-colab-container-inference.yml"
      - "scripts/probe_separator_900ms.py"
      - "scripts/prepare_backend.sh"
      - "src/audio_restoration_colab/**"
      - "workers/separator_server.py"
      - "workers/separator_worker.py"

permissions:
  contents: read

jobs:
  inference:
    name: Все модели, настоящий forward 900 мс
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Получить код ветки
        uses: actions/checkout@v7.0.1

      - name: Проверить место перед образом
        run: df -h

      - name: Скачать официальный CPU-образ Google Colab
        run: docker pull us-docker.pkg.dev/colab-images/public/cpu-runtime

      - name: Полный forward всех моделей на аудио 900 мс
        run: |
          mkdir -p probe-artifacts
          docker run --rm \
            --shm-size=2g \
            --entrypoint /bin/bash \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e AUDIO_RESTORATION_PROJECT_ROOT=/workspace \
            -e AUDIO_RESTORATION_CACHE=/tmp/audio-models \
            -e PYTHONPATH=/workspace/src:/workspace/workers \
            us-docker.pkg.dev/colab-images/public/cpu-runtime \
            -lc '
              set -u
              python3 -m pip install --quiet uv==0.12.1 || exit 10
              export PATH="/root/.local/bin:/usr/local/bin:$PATH"
              command -v ffmpeg || exit 11
              chmod +x scripts/prepare_backend.sh
              scripts/prepare_backend.sh separator /tmp/audio-models || exit 12

              models=(
                denoise_normal
                denoise_aggressive
                stems_vocal_balanced
                stems_vocal_clean
                stems_instrumental_clean
                stems_instrumental_full
                stems_karaoke
                stems_six
                stems_four
                dereverb_big
                dereverb_super
                dereverb_echo
                dereverb_fused
                stems_bleed_suppressor
                stems_aspiration
              )

              overall=0
              for model in "${models[@]}"; do
                echo "========== REAL 900 MS INFERENCE: $model =========="
                repeat=1
                if [[ "$model" == "stems_six" ]]; then
                  repeat=2
                fi
                mkdir -p "/workspace/probe-artifacts/$model"
                export AUDIO_RESTORATION_JOB_LOG="/workspace/probe-artifacts/$model/model.log"
                /tmp/audio-models/envs/separator/bin/python \
                  scripts/probe_separator_900ms.py \
                  --model-id "$model" \
                  --repeat "$repeat" \
                  --work-root /workspace/probe-artifacts \
                  2>&1 | tee "/workspace/probe-artifacts/$model/container.log"
                status=${PIPESTATUS[0]}
                if [[ "$status" -ne 0 ]]; then
                  overall=1
                  echo "MODEL_FAILED=$model status=$status"
                else
                  echo "MODEL_PASSED=$model"
                fi

                rm -rf /tmp/audio-models/weights/separator/* || true
                rm -rf /tmp/audio-models/weights/bs-roformer-infer/* || true
              done
              exit "$overall"
            '

      - name: Сохранить все отчёты, WAV и полные логи
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: colab-900ms-all-models
          path: probe-artifacts/
          if-no-files-found: warn
          retention-days: 14
